name: deterministic-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install core and test dependencies
        run: python -m pip install -e './jepa-anything-core[dev]'
      - name: Run deterministic checks
        run: make check
